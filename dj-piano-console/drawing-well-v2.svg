ear on a rebate; confirm against the units</text><line x1="318.0" y1="68.0" x2="430.0" y2="149.6" stroke="#1E1E1E" stroke-width="0.6" opacity="1.0"/><circle cx="318.0" cy="68.0" r="1.6" fill="#1E1E1E" stroke="none" stroke-width="1.0"/><text x="434.0" y="152.6" font-size="9" text-anchor="start" fill="#1E1E1E" font-weight="normal">Faceplate flush with oak; 2 mm clearance at sides and rear, none at front</text><line x1="222.0" y1="208.0" x2="430.0" y2="184.8" stroke="#1E1E1E" stroke-width="0.6" opacity="1.0"/><circle cx="222.0" cy="208.0" r="1.6" fill="#1E1E1E" stroke="none" stroke-width="1.0"/><text x="434.0" y="187.8" font-size="9" text-anchor="start" fill="#1E1E1E" font-weight="normal">Technics plinth has no flange: stands on its own feet on the floor at 91</text><line x1="270.0" y1="226.4" x2="430.0" y2="220.0" stroke="#1E1E1E" stroke-width="0.6" opacity="1.0"/><circle cx="270.0" cy="226.4" r="1.6" fill="#1E1E1E" stroke="none" stroke-width="1.0"/><text x="434.0" y="223.0" font-size="9" text-anchor="start" fill="#1E1E1E" font-weight="normal">Well floor 18 mm on slotted cleats, +/-10 mm: top face 91, underside 89.2</text><line x1="318.0" y1="252.0" x2="430.0" y2="255.2" stroke="#1E1E1E" stroke-width="0.6" opacity="1.0"/><circle cx="318.0" cy="252.0" r="1.6" fill="#1E1E1E" stroke="none" stroke-width="1.0"/><text x="434.0" y="258.2" font-size="9" text-anchor="start" fill="#1E1E1E" font-weight="normal">Cleat 20 x 14 mm, two per well, front to back; top face flush under the floor</text><line x1="366.0" y1="132.0" x2="430.0" y2="290.4" stroke="#1E1E1E" stroke-width="0.6" opacity="1.0"/><circle cx="366.0" cy="132.0" r="1.6" fill="#1E1E1E" stroke="none" stroke-width="1.0"/><text x="434.0" y="293.4" font-size="9" text-anchor="start" fill="#1E1E1E" font-weight="normal">Rear wall slots into the cable trough; leads and the Xone&#x27;s heat exit there</text><text x="126.0" y="285.6" font-size="8" text-anchor="start" fill="#555" font-weight="normal" font-style="italic">finger notches at two corners of each well, r 20 mm</text></svg>